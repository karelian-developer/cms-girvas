image: alpine/git:latest

variables:
  GITHUB_REPO_URL: "git@github.com:karelian-developer/cms-girvas.git"

mirror_to_github:
  stage: deploy
  script:
    # Настройка SSH
    - mkdir -p ~/.ssh
    - printf "%s" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    
    # Конфигурация git (важно для корректной работы)
    - git config --global user.email "drelagas.new@yandex.ru"
    - git config --global user.name "Drelagas"
    
    # Отзеркаливание
    - git remote remove github 2>/dev/null || true
    - git remote add github "$GITHUB_REPO_URL"
    - git push --mirror github
    
    # Очистка SSH ключа (опционально, но рекомендуется)
    - rm -f ~/.ssh/id_rsa
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  only:
    - main # или ваша основная ветка